name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build-windows-exe:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if (Test-Path requirements.txt) { pip install -r requirements.txt }
          pip install pyinstaller

      - name: Build EXE with PyInstaller
        run: |
          pyinstaller --noconfirm --onefile --name CooperRiverDealFinder.exe app.py

      - name: Install NSIS (for installer)
        run: choco install -y nsis

      - name: Create installer directory and copy EXE
        run: |
          mkdir installer
          copy dist\CooperRiverDealFinder.exe installer\CooperRiverDealFinder.exe

      - name: Build NSIS installer
        run: |
          makensis installer\CooperRiverInstaller.nsi

      - name: Package artifacts
        uses: actions/upload-artifact@v4
        with:
          name: CooperRiverDealFinder-windows
          path: |
            dist/CooperRiverDealFinder.exe
            installer/CooperRiverDealFinder-setup.exe
